    <rect x="40" y="70" width="170" height="90" rx="8" fill="#FFFFFF" stroke="#0F6E6B" stroke-width="2"/>
    <text x="125" y="108" text-anchor="middle" font-weight="700" fill="#0E2433">USB webcam</text>
