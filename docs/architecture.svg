    <line x1="460" y1="115" x2="518" y2="115" stroke="#0F6E6B" stroke-width="2"/>
    <polygon points="518,109 526,115 518,121" fill="#0F6E6B"/>
    <line x1="750" y1="115" x2="808" y2="115" stroke="#0F6E6B" stroke-width="2"/>
